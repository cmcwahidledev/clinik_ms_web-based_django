{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-100 flex justify-center px-6 py-10">

    <div class="w-full max-w-6xl grid md:grid-cols-2 gap-10">

        <!-- Contact Info -->
        <div class="bg-white rounded-2xl shadow-md p-8">

            <h2 class="text-3xl font-bold text-gray-800 mb-4">Contact Us</h2>
            <p class="text-gray-500 mb-8">
                Haddii aad su’aal qabto ama aad u baahan tahay caawimaad, nala soo xiriir.
            </p>

            <div class="space-y-4 text-gray-700">

                <div class="flex items-center space-x-3">
                    <span
                        class="w-10 h-10 bg-blue-100 text-blue-600 flex items-center justify-center rounded-full">📍</span>
                    <p>Hargeisa, Somaliland</p>
                </div>

                <div class="flex items-center space-x-3">
                    <span
                        class="w-10 h-10 bg-green-100 text-green-600 flex items-center justify-center rounded-full">📞</span>
                    <p>+252 63 0000000</p>
                </div>

                <div class="flex items-center space-x-3">
                    <span
                        class="w-10 h-10 bg-purple-100 text-purple-600 flex items-center justify-center rounded-full">📧</span>
                    <p>info@clinic.com</p>
                </div>

            </div>

        </div>

        <!-- Contact Form -->
        <div class="bg-white rounded-2xl shadow-md p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">Send Message</h2>

            <form class="space-y-5">

                <div>
                    <label class="text-gray-600 font-medium">Full Name</label>
                    <input type="text" placeholder="Enter your name"
                        class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="text-gray-600 font-medium">Email</label>
                    <input type="email" placeholder="Enter your email"
                        class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="text-gray-600 font-medium">Message</label>
                    <textarea rows="4" placeholder="Write your message..."
                        class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
