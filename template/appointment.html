{% extends "base.html" %}

{% block content %}

<div class="flex items-center justify-center px-6">

    <div class="w-full max-w-5xl">

        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800">Appointments</h1>
            <p class="text-gray-500 mt-2">Choose an action to continue</p>
        </div>

        <!-- Cards -->
        <div class="grid md:grid-cols-2 gap-8">

            <!-- Schedule Card -->
            <a href="{% url 'schedule' %}"
                class="block group bg-white rounded-2xl shadow-lg p-10 hover:shadow-2xl transition border-l-4 border-blue-500">

                <div class="flex flex-col items-center text-center">

                    <div
                        class="w-16 h-16 bg-blue-100 text-blue-600 flex items-center justify-center rounded-full text-2xl">
                        📅
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800 mt-5 group-hover:text-blue-600">
                        Schedule
                    </h2>

                    <p class="text-gray-500 mt-2">
                        Create and manage appointment schedules
                    </p>

                    <div class="mt-6 text-blue-600 font-semibold">
                        Go to Schedule →
                    </div>

                </div>

            </a>

            <!-- Appointment List Card -->
            <a href="{% url 'appointment_list' %}"
                class="block group bg-white rounded-2xl shadow-lg p-10 hover:shadow-2xl transition border-l-4 border-green-500">

                <div class="flex flex-col items-center text-center">

                    <div
                        class="w-16 h-16 bg-green-100 text-green-600 flex items-center justify-center rounded-full text-2xl">
                        📋
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800 mt-5 group-hover:text-green-600">
                        Appointment List
                    </h2>

                    <p class="text-gray-500 mt-2">
                        View all booked appointments
                    </p>

                    <div class="mt-6 text-green-600 font-semibold">
                        View List →
                    </div>

                </div>

            </a>

        </div>

    </div>

</div>

{% endblock %}
