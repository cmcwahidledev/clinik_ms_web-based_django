{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-100 flex justify-center px-6 py-10">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Add Doctor</h1>
            <p class="text-gray-500">Fill doctor information below</p>
        </div>

        <!-- Form -->
        <form class="grid md:grid-cols-2 gap-6">

            <!-- Full Name -->
            <div class="md:col-span-2">
                <label class="text-gray-600 font-medium">Full Name</label>
                <input type="text" placeholder="Enter doctor full name"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Specialization -->
            <div>
                <label class="text-gray-600 font-medium">Specialization</label>
                <input type="text" placeholder="e.g Cardiologist"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Phone -->
            <div>
                <label class="text-gray-600 font-medium">Phone Number</label>
                <input type="tel" placeholder="+252 63 0000000"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Email -->
            <div class="md:col-span-2">
                <label class="text-gray-600 font-medium">Email</label>
                <input type="email" placeholder="doctor@email.com"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Experience -->
            <div>
                <label class="text-gray-600 font-medium">Experience (Years)</label>
                <input type="number" placeholder="5"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Gender -->
            <div>
                <label class="text-gray-600 font-medium">Gender</label>
                <select class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <!-- Submit -->
            <div class="md:col-span-2">
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold shadow-md transition">
                    Save Doctor
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
