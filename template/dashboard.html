{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="min-h-screen bg-gray-100 flex justify-center">

    <!-- Container (LEFT + RIGHT space si uu u durko) -->
    <div class="w-full max-w-6xl px-6 py-8">

        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-8">

            <div>
                <h1 class="text-3xl font-bold text-gray-800">Dashboard</h1>
                <p class="text-gray-500">Clinic Management Overview</p>
            </div>

            <!-- Logout Button -->
            <button class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg shadow-md transition">
                <a href="{% url 'login' %}" class="text-white no-underline">Logout</a>
            </button>

        </div>

        <!-- Stats Cards -->
        <div class="grid md:grid-cols-3 gap-6 mb-10">

            <div class="bg-white rounded-2xl shadow-md p-6 border-l-4 border-blue-500">
                <h2 class="text-gray-500 font-medium">Total Doctors</h2>
                <p class="text-3xl font-bold text-gray-800 mt-2">25</p>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-6 border-l-4 border-green-500">
                <h2 class="text-gray-500 font-medium">Total Patients</h2>
                <p class="text-3xl font-bold text-gray-800 mt-2">120</p>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-6 border-l-4 border-purple-500">
                <h2 class="text-gray-500 font-medium">Total Appointments</h2>
                <p class="text-3xl font-bold text-gray-800 mt-2">45</p>
            </div>

        </div>

        <!-- Images Section -->
        <div class="grid md:grid-cols-3 gap-6">

            <div class="rounded-2xl overflow-hidden shadow-lg group">
                <img src="{% static 'img/clinic.png' %}"
                    class="h-64 w-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="rounded-2xl overflow-hidden shadow-lg group">
                <img src="{% static 'img/doctor.png' %}"
                    class="h-64 w-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="rounded-2xl overflow-hidden shadow-lg group">
                <img src="{% static 'img/patient.png' %}"
                    class="h-64 w-full object-cover group-hover:scale-105 transition duration-500">
            </div>

        </div>

    </div>
</div>
{% endblock %}
