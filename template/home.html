{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="max-w-7xl mx-auto px-6 py-10">

    <div class="grid md:grid-cols-3 gap-6">

        <!-- Image 1 -->
        <div class="relative overflow-hidden rounded-2xl shadow-lg group">
            <img src="{% static 'img/clinic.png' %}" alt="Hospital"
                class="w-full h-80 object-cover group-hover:scale-110 transition duration-500">

            <div class="absolute inset-0 bg-black/40 flex items-end">
                <div class="p-6 text-white">
                    <h2 class="text-2xl font-bold">Clinic Image</h2>
                </div>
            </div>
        </div>

        <!-- Image 2 -->
        <div class="relative overflow-hidden rounded-2xl shadow-lg group">
            <img src="{% static 'img/doctor.png' %}" alt="Doctor"
                class="w-full h-80 object-cover group-hover:scale-110 transition duration-500">

            <div class="absolute inset-0 bg-black/40 flex items-end">
                <div class="p-6 text-white">
                    <h2 class="text-2xl font-bold">Doctors Image</h2>
                </div>
            </div>
        </div>

        <!-- Image 3 -->
        <div class="relative overflow-hidden rounded-2xl shadow-lg group">
            <img src="{% static 'img/patient.png' %}" alt="Patient"
                class="w-full h-80 object-cover group-hover:scale-110 transition duration-500">

            <div class="absolute inset-0 bg-black/40 flex items-end">
                <div class="p-6 text-white">
                    <h2 class="text-2xl font-bold">Patient Image</h2>
                </div>
            </div>
        </div>

    </div>

</section>
{% endblock %}
