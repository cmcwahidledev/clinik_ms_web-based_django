{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen bg-gray-100 flex justify-center px-6 py-10">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-10">

        <!-- Title -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Create Schedule</h1>
            <p class="text-gray-500">Add new appointment details below</p>
        </div>

        <!-- Form -->
        <form class="grid md:grid-cols-2 gap-6">

            <!-- Full Name -->
            <div class="md:col-span-2">
                <label class="text-gray-600 font-medium">Full Name</label>
                <input type="text" placeholder="Enter patient full name"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Appointment Name -->
            <div class="md:col-span-2">
                <label class="text-gray-600 font-medium">Appointment Name</label>
                <input type="text" placeholder="e.g Dental Checkup"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Time In -->
            <div>
                <label class="text-gray-600 font-medium">Time In</label>
                <input type="time"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Time Out -->
            <div>
                <label class="text-gray-600 font-medium">Time Out</label>
                <input type="time"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Date -->
            <div class="md:col-span-2">
                <label class="text-gray-600 font-medium">Date</label>
                <input type="date"
                    class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Submit Button -->
            <div class="md:col-span-2">
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold shadow-md transition">
                    Save Schedule
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
